name: push docker images 

on:
  push:
    tags:
      - "v*"

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout Repo
          uses: actions/checkout@v3
        
        - name: Log into the dockerhub
          run: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

        - name: Build and push the docker images to dockerhub / registry
          run: |
            TAG=${{ github.ref_name }}
            docker build -t ecommerce-site .
            docker tag ecommerce-site ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-site:$TAG
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-site:$TAG