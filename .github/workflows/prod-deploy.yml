name: Deploy ecom-webapp

on:
  push:
    tags:
       - "*"

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout
          uses: actions/checkout@v6
        
        - name: Log into the dockerhub
          run: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

        - name: Build and push the docker images to dockerhub / registry
          run: |
            TAG_NAME=${{ github.ref_name }}
            docker build -t ecommerce-site .
            docker tag ecommerce-site ${{ secrets.DOCKERHUB_USERNAME }}/ecom-webapp:$TAG_NAME
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-site:$TAG_NAME