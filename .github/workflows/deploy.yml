name: Deploy ecom-webapp

on:
  push:
    branches:
       - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout
          uses: actions/checkout@v6
        
        - name: Log into the dockerhub
          run: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

        - name: Build and push the docker images to dockerhub / registry
          run: |
            BRANCH_NAME=${{ github.ref_name }}
            docker build -t ecom-webapp .
            docker tag ecom-webapp ${{ secrets.DOCKERHUB_USERNAME }}/ecom-webapp:$BRANCH_NAME
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/ecom-webapp:$BRANCH_NAME
            
        - name: Deploy to server
          uses: appleboy/ssh-action@v1
          with:
            host: ${{ secrets.SERVER_HOST }}
            username: ${{ secrets.SERVER_USER }}
            key: ${{ secrets.SERVER_PSSH_KEY }}
            options: "-o StrictHostKeyChecking=no"
            script: |

                echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

                # Create a directory named ecom-webapp and cd into that directory and write this docker-compose file below 

                mkdir /home/ubuntu/ecom-webapp && cd /home/ubuntu/ecom-webapp

                # Create docker-compose.yml using cat with EOF
                cat > docker-compose.yml << 'EOF'
                version: '3.8'
                services:
                ecom-webapp:
                image: kubenix/ecom-webapp:main
                container_name: ecommerce-web-application
                ports:
                - "81:80"
                restart: always
                EOF
      
                 # Turn down the previous deployment
                docker compose down
                
                # Pull the docker images
                docker compose pull
                
                # Start the docker compose file/Start the deployement
                docker compose up -d